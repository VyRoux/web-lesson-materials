<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pengiriman - AstraNova</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/icon.png" type="image/png">
</head>

<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <img src="assets/logo-transparant.png" alt="Logo AstraNova" class="logo">
                <h1>AstraNova</h1>
            </div>
            <div class="header-right">
                <span id="greeting" class="greeting"></span>
                <button id="logoutBtn" class="btn-secondary">Keluar</button>
            </div>
        </header>

        <nav class="dashboard-nav">
            <ul>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="stok.html" class="nav-link">Informasi Bahan Materi</a></li>
                <li><a href="tracking.html" class="nav-link active  ">Tracking Pengiriman</a></li>
                <li class="dropdown">
                    <a href="#" class="nav-link">Bahan Materi</a>
                    <div class="dropdown-content">
                        <a href="#">HTML</a>
                        <a href="#">CSS</a>
                        <a href="#">JS</a>
                        <a href="#">PHP</a>
                    </div>
                </li>
            </ul>
        </nav>

        <main class="tracking-main">
            <h2>Tracking Pengiriman</h2>

            <div class="tracking-form">
                <div class="form-group">
                    <label for="doNumber">Nomor Delivery Order</label>
                    <input type="text" id="doNumber" name="doNumber" placeholder="Masukkan nomor DO">
                </div>
                <button id="searchBtn" class="btn-primary">Cari</button>
            </div>

            <div id="trackingResult" class="tracking-result">
                <!-- Hasil pencarian akan ditampilkan di sini -->
            </div>

            <!-- Tabel Data Dummy -->
            <div class="dummy-section">
                <h3>Data Pengguna untuk Testing</h3>
                <p class="subtitle">Gunakan nomor NK berikut untuk mencoba fitur tracking:</p>

                <table class="stock-table dummy-table">
                    <thead>
                        <tr>
                            <th>Nomor Kurir</th>
                            <th>Nama Kurir</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Ekspedisi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dummyTableBody">
                        <!-- Data akan diisi oleh JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
